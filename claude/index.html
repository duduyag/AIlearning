<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Everything Claude Can Do</title>
  <meta name="description" content="A bilingual Claude learning path from beginner use to Claude Code, MCP, agents, subagents, Cowork, design, and professional AI workflows.">
  <style>
    :root {
      --ink: #111827;
      --muted: #5b6472;
      --line: #d7dde6;
      --paper: #f7f8fa;
      --panel: #ffffff;
      --accent: #b84d2f;
      --accent-2: #176b87;
      --accent-3: #5b4bb2;
      --ok: #18794e;
      --shadow: 0 14px 34px rgba(17, 24, 39, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(247,248,250,.96)),
        url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1800&q=80") center top / cover fixed;
    }

    body[dir="rtl"] {
      font-family: "Noto Sans Hebrew", "Rubik", Arial, system-ui, sans-serif;
    }

    a { color: inherit; }

    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      padding: 22px 0 30px;
      border-bottom: 1px solid rgba(17,24,39,.12);
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(12px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
    }

    .brand {
      font-size: 14px;
      font-weight: 850;
      color: #273142;
    }

    .language-switch {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(17, 24, 39, .06);
    }

    .language-switch button {
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #344054;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 850;
      min-width: 76px;
      padding: 8px 12px;
    }

    .language-switch button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }

    body[dir="rtl"] .eyebrow {
      letter-spacing: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      font-size: 54px;
      line-height: 1;
      margin: 0 0 18px;
      letter-spacing: 0;
      max-width: 820px;
    }

    .subtitle {
      font-size: 19px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 890px;
      margin: 0;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 28px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
      min-height: 94px;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    main {
      padding: 34px 0 70px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(247,248,250,.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(17,24,39,.1);
      margin: 0 0 24px;
      padding: 12px 0;
    }

    .nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .nav a {
      flex: 0 0 auto;
      text-decoration: none;
      border: 1px solid var(--line);
      background: #fff;
      color: #273142;
      padding: 9px 12px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
    }

    .section-title {
      margin: 34px 0 16px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 10px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0;
    }

    .section-title p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      max-width: 470px;
      line-height: 1.4;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 190px 1fr;
      min-height: 245px;
    }

    body[dir="rtl"] .card {
      grid-template-columns: 1fr 190px;
    }

    .thumb {
      position: relative;
      background: #101827;
      min-height: 245px;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(.95) contrast(1.05);
    }

    .level {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(17,24,39,.16);
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 800;
    }

    body[dir="rtl"] .level {
      left: auto;
      right: 10px;
    }

    .content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .content h3 {
      margin: 0;
      font-size: 20px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .content p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.48;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .pill {
      border: 1px solid var(--line);
      background: #f7f8fa;
      border-radius: 999px;
      padding: 5px 8px;
      color: #344054;
      font-size: 12px;
      font-weight: 750;
    }

    .watch {
      margin-top: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    .watch a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #fff;
      background: var(--ink);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    .watch small {
      color: var(--muted);
      line-height: 1.35;
      font-size: 12px;
    }

    .duration {
      align-self: flex-start;
      border: 1px solid rgba(184, 77, 47, .28);
      background: #fff5f1;
      border-radius: 8px;
      color: #8f351f;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.2;
      padding: 8px 10px;
    }

    .practice {
      border-left: 4px solid var(--accent-2);
      background: #f0f7fa;
      padding: 9px 10px;
      border-radius: 6px;
      color: #173b4a;
      font-size: 13px;
      line-height: 1.42;
    }

    body[dir="rtl"] .practice {
      border-left: 0;
      border-right: 4px solid var(--accent-2);
    }

    .capstone {
      background: #101827;
      color: #fff;
      border-radius: 8px;
      padding: 28px;
      margin-top: 28px;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 24px;
      box-shadow: var(--shadow);
    }

    .capstone h2 { margin: 0 0 12px; font-size: 30px; }
    .capstone p { color: #cbd5e1; line-height: 1.6; margin: 0 0 16px; }
    .capstone ol { margin: 0; padding-left: 22px; color: #e5e7eb; line-height: 1.7; }
    body[dir="rtl"] .capstone ol { padding-left: 0; padding-right: 22px; }

    .checklist {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px;
      padding: 18px;
    }

    .checklist strong { display: block; margin-bottom: 8px; }
    .checklist ul { margin: 0; padding-left: 20px; line-height: 1.65; color: #dce6f1; }
    body[dir="rtl"] .checklist ul { padding-left: 0; padding-right: 20px; }

    footer {
      border-top: 1px solid var(--line);
      background: #fff;
      padding: 28px 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 960px) {
      h1 { font-size: 42px; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .grid { grid-template-columns: 1fr; }
      .capstone { grid-template-columns: 1fr; }
      body[dir="rtl"] .card,
      .card { grid-template-columns: 190px 1fr; }
    }

    @media (max-width: 640px) {
      .wrap { width: min(100% - 22px, 1180px); }
      .topbar { align-items: flex-start; flex-direction: column; }
      h1 { font-size: 34px; }
      .subtitle { font-size: 17px; }
      .summary { grid-template-columns: 1fr; }
      .section-title { align-items: start; flex-direction: column; }
      body[dir="rtl"] .card,
      .card { grid-template-columns: 1fr; }
      .thumb { min-height: 190px; }
      .watch { align-items: stretch; flex-direction: column; }
      .watch a { justify-content: center; }
    }
  </style>
</head>

    const youtubeImage = (src) => src.startsWith("http") ? src : `https://img.youtube.com/vi/${src}/hqdefault.jpg`;

    function cardDuration(card, lang) {
      const image = card[2];
      const href = card[8];
      if (durations[image]) return durations[image];
      if (href.includes("playlist?list=")) return lang.playlistDuration;
      return "";
    }

    function createCard(card, lang) {
      const [section, level, image, alt, title, desc, tags, practice, href, note] = card;
      const duration = cardDuration(card, lang);
      return `
        <article class="card" data-section="${section}">
          <div class="thumb"><img src="${youtubeImage(image)}" alt="${alt}"><span class="level">${level}</span></div>
          <div class="content">
            <h3>${title}</h3>
            <p>${desc}</p>
            <div class="meta">${tags.map(tag => `<span class="pill">${tag}</span>`).join("")}</div>
            <div class="practice"><strong>${lang.practice}</strong> ${practice}</div>
            <div class="watch"><a href="${href}" target="_blank" rel="noopener">${lang.watch}</a><small>${note}</small></div>
            <div class="duration">${lang.durationLabel} ${duration}</div>
          </div>
        </article>`;
    }

    function render(langCode) {
      const lang = data[langCode];
      document.documentElement.lang = lang.htmlLang;
      document.documentElement.dir = lang.dir;
      document.body.dir = lang.dir;
      document.title = lang.titleTag;
      document.querySelectorAll("[data-lang]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.lang === langCode));
      });
      document.querySelectorAll("[data-i18n]").forEach(node => {
        node.innerHTML = lang[node.dataset.i18n];
      });
      document.getElementById("summary").innerHTML = lang.summary
        .map(([value, label]) => `<div class="stat"><strong>${value}</strong><span>${label}</span></div>`)
        .join("");
      document.getElementById("nav").innerHTML = lang.nav
        .map(([id, label]) => `<a href="#${id}">${label}</a>`)
        .join("");
      document.getElementById("content").innerHTML = lang.sections.map(section => `
        <section id="${section.id}">
          <div class="section-title">
            <h2>${section.title}</h2>
            <p>${section.desc}</p>
          </div>
          <div class="grid">
            ${lang.cards.filter(card => card[0] === section.id).map(card => createCard(card, lang)).join("")}
          </div>
        </section>`).join("") + `
        <section id="capstone" class="capstone">
          <div>
            <h2>${lang.capstone.title}</h2>
            <p>${lang.capstone.desc}</p>
            <ol>${lang.capstone.steps.map(step => `<li>${step}</li>`).join("")}</ol>
          </div>
          <div class="checklist">
            <strong>${lang.capstone.checklistTitle}</strong>
            <ul>${lang.capstone.checklist.map(item => `<li>${item}</li>`).join("")}</ul>
          </div>
        </section>`;
      localStorage.setItem("claude-roadmap-lang", langCode);
    }

    document.querySelectorAll("[data-lang]").forEach(button => {
      button.addEventListener("click", () => render(button.dataset.lang));
    });

    const initialLang = new URLSearchParams(window.location.search).get("lang")
      || localStorage.getItem("claude-roadmap-lang")
      || "he";
    render(data[initialLang] ? initialLang : "en");
  </script>
